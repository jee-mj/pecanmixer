[package]
name = "pecanmixer"
version = "0.1.0"
description = "Patchbay en mixer voor PipeWire"
license = "GPL-3.0-or-later"
repository = "https://github.com/BadgerSoft-NL/pecanmixer"
authors = ["Jetse"]
edition = "2021"

[lib]
name = "pecanmixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
# Het tray-icoon: StatusNotifierItem rechtstreeks over D-Bus, zodat een klik
# de app opent en het menu op de rechterklik zit. Zie tray.rs.
ksni = { version = "0.3", features = ["blocking"] }
# Twee vensters die om beurten links leggen en weghalen helpt niemand.
tauri-plugin-single-instance = "2"
pecan-pipewire = { path = "../crates/pecan-pipewire" }
# Serialization stays at the temporary legacy IPC boundary.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the existing native probe examples.
pipewire = "0.10"

[package]
name = "pecan-ui-gtk"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Non-installed read-only GTK connectivity preview for Pecan Mixer"

[dependencies]
pecan-core = { path = "../pecan-core" }
pecan-pipewire = { path = "../pecan-pipewire" }
gtk = { package = "gtk4", version = "0.11", default-features = false }
serde_json.workspace = true
